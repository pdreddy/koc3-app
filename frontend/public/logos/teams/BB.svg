<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="50" fill="url(#bg)"/>
  <!-- Baseline (court line) -->
  <rect x="16" y="60" width="68" height="5" rx="2.5" fill="#a78bfa"/>
  <!-- Tennis racquet slamming down -->
  <ellipse cx="50" cy="36" rx="15" ry="18" fill="none" stroke="#e9d5ff" stroke-width="3.5"/>
  <line x1="50" y1="18" x2="50" y2="54" stroke="#e9d5ff" stroke-width="1.5" opacity=".6"/>
  <line x1="35" y1="36" x2="65" y2="36" stroke="#e9d5ff" stroke-width="1.5" opacity=".6"/>
  <line x1="38" y1="26" x2="62" y2="26" stroke="#e9d5ff" stroke-width="1.2" opacity=".45"/>
  <line x1="38" y1="46" x2="62" y2="46" stroke="#e9d5ff" stroke-width="1.2" opacity=".45"/>
  <line x1="40" y1="20" x2="40" y2="52" stroke="#e9d5ff" stroke-width="1.2" opacity=".45"/>
  <line x1="60" y1="20" x2="60" y2="52" stroke="#e9d5ff" stroke-width="1.2" opacity=".45"/>
  <rect x="47.5" y="53" width="5" height="8" rx="2.5" fill="#e9d5ff"/>
  <!-- Impact lines -->
  <line x1="50" y1="61" x2="46" y2="68" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="61" x2="54" y2="68" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <text x="50" y="84" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="9" font-weight="900" fill="#ede9fe" letter-spacing="3">BB</text>
</svg>
