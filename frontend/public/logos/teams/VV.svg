<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="50" fill="url(#bg)"/>
  <!-- Snake body S-curve -->
  <path d="M50,16 Q70,16 70,32 Q70,48 50,48 Q30,48 30,64 Q30,80 50,80" fill="none" stroke="#86efac" stroke-width="9" stroke-linecap="round"/>
  <path d="M50,16 Q70,16 70,32 Q70,48 50,48 Q30,48 30,64 Q30,80 50,80" fill="none" stroke="#4ade80" stroke-width="5" stroke-linecap="round"/>
  <!-- Snake head -->
  <ellipse cx="50" cy="14" rx="8" ry="6" fill="#4ade80" stroke="#86efac" stroke-width="1.5" transform="rotate(-10,50,14)"/>
  <!-- Tongue -->
  <path d="M50,8 L48,3 M50,8 L52,3" fill="none" stroke="#f87171" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Eyes -->
  <ellipse cx="46" cy="12" rx="2" ry="2.5" fill="#111"/>
  <ellipse cx="54" cy="12" rx="2" ry="2.5" fill="#111"/>
  <circle cx="46.5" cy="11.5" r=".8" fill="#fff"/>
  <circle cx="54.5" cy="11.5" r=".8" fill="#fff"/>
  <!-- Tail tip -->
  <circle cx="50" cy="80" r="3" fill="#4ade80"/>
  <text x="50" y="96" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="9" font-weight="900" fill="#bbf7d0" letter-spacing="3">VV</text>
</svg>
