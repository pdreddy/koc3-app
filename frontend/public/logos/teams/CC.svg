<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="50" fill="url(#bg)"/>
  <!-- Bow -->
  <path d="M26,22 Q18,45 26,68" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  <line x1="26" y1="22" x2="26" y2="68" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <!-- Bowstring -->
  <line x1="26" y1="22" x2="26" y2="68" stroke="#fde68a" stroke-width="1.5" stroke-dasharray="2,2"/>
  <!-- Arrow -->
  <line x1="30" y1="45" x2="80" y2="45" stroke="#fef3c7" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Arrowhead -->
  <polygon points="80,45 70,40 72,45 70,50" fill="#fbbf24"/>
  <!-- Arrow fletching -->
  <polygon points="30,45 36,39 34,45 36,51" fill="#f87171"/>
  <text x="58" y="72" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="9" font-weight="900" fill="#fef3c7" letter-spacing="2">CC</text>
</svg>
