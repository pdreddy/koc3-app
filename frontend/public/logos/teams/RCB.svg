<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="50" fill="url(#bg)"/>
  <!-- Badger face -->
  <!-- White stripe on head -->
  <ellipse cx="50" cy="38" rx="16" ry="18" fill="#e5e7eb"/>
  <ellipse cx="50" cy="38" rx="8" ry="18" fill="#f9fafb"/>
  <!-- Black sides -->
  <ellipse cx="38" cy="36" rx="8" ry="14" fill="#1f2937"/>
  <ellipse cx="62" cy="36" rx="8" ry="14" fill="#1f2937"/>
  <!-- Eyes -->
  <circle cx="42" cy="34" r="4" fill="#1f2937"/>
  <circle cx="58" cy="34" r="4" fill="#1f2937"/>
  <circle cx="43" cy="33" r="1.5" fill="#fff"/>
  <circle cx="59" cy="33" r="1.5" fill="#fff"/>
  <!-- Nose -->
  <ellipse cx="50" cy="44" rx="4" ry="3" fill="#374151"/>
  <ellipse cx="50" cy="43" rx="2.5" ry="1.8" fill="#111827"/>
  <!-- Mouth -->
  <path d="M44,47 Q50,52 56,47" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <!-- Claws -->
  <line x1="30" y1="60" x2="24" y2="70" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
  <line x1="34" y1="60" x2="30" y2="71" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
  <line x1="66" y1="60" x2="70" y2="70" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
  <line x1="70" y1="60" x2="76" y2="69" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
  <text x="50" y="88" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="9" font-weight="900" fill="#d1d5db" letter-spacing="2">RCB</text>
</svg>
